<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Tabungan Santri</title>
    
    <!-- Font dan Ikon tetap dibiarkan -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- CSS MURNI (Dijamin Jalan di Smart TV) -->
    <style>
        /* Reset Dasar */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a; 
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 20px 30px;
            border-radius: 20px;
            border: 2px solid #334155;
            flex-shrink: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-icon {
            background: linear-gradient(135deg, #34d399 0%, #059669 100%);
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 2.5rem;
            color: white;
        }
        .header-title { font-size: 2.2rem; font-weight: 900; color: #6ee7b7; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; line-height: 1;}
        .header-subtitle { font-size: 1.1rem; color: #cbd5e1; font-weight: 600; letter-spacing: 1px;}
        .header-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .clock { font-size: 3rem; font-weight: 900; font-family: monospace; line-height: 1; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);}
        .date { font-size: 0.9rem; color: #cbd5e1; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px;}
        .sync-badge { font-size: 0.8rem; font-weight: bold; padding: 5px 12px; border-radius: 20px; margin-top: 10px; display: inline-block;}
        .sync-ok { background-color: rgba(6, 78, 59, 0.5); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }

        /* --- LAYOUT UTAMA (KIRI KANAN) --- */
        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0; /* Penting untuk flexbox overflow */
        }
        .col-left, .col-right {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- KARTU JUARA 1, 2, 3 (KIRI) --- */
        .card-top {
            flex: 1; /* Membagi tinggi rata */
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
        }
        /* Warna Medali */
        .bg-gold { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: white; }
        .bg-silver { background: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 100%); color: #1e293b; }
        .bg-bronze { background: linear-gradient(135deg, #fdba74 0%, #c2410c 100%); color: white; }
        
        .watermark {
            position: absolute;
            right: -20px;
            bottom: -40px;
            font-size: 15rem;
            opacity: 0.15;
            z-index: 1;
        }
        .bg-gold .watermark { color: #fef3c7; }
        .bg-silver .watermark { color: #f1f5f9; }
        .bg-bronze .watermark { color: #ffedd5; }

        .top-rank { font-size: 4rem; font-weight: 900; font-style: italic; width: 80px; z-index: 2; text-shadow: 2px 2px 5px rgba(0,0,0,0.2);}
        .top-details { flex: 1; z-index: 2; border-left: 2px solid rgba(255,255,255,0.3); padding-left: 25px; overflow: hidden; }
        .bg-silver .top-details { border-left-color: rgba(0,0,0,0.1); }
        
        .top-name { font-size: 2.2rem; font-weight: 900; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; margin-bottom: 5px; }
        .top-class { font-size: 1rem; font-weight: bold; text-transform: uppercase; opacity: 0.9; margin-bottom: 5px;}
        .top-amount { font-size: 2.8rem; font-weight: 900; line-height: 1; text-shadow: 2px 2px 5px rgba(0,0,0,0.2);}

        /* --- KARTU JUARA 4-10 (KANAN) --- */
        .card-list {
            flex: 1; /* Membagi tinggi rata */
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 0 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .list-left { display: flex; align-items: center; flex: 1; overflow: hidden; }
        .list-rank { font-size: 1.5rem; font-weight: 900; font-style: italic; color: #64748b; width: 45px; }
        .list-details { flex: 1; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 15px; overflow: hidden; }
        .list-name { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; margin-bottom: 2px;}
        .list-class { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #94a3b8; }
        
        .list-amount {
            font-size: 1.2rem;
            font-weight: 900;
            color: #34d399;
            background-color: #0f172a;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            margin-left: 15px;
            flex-shrink: 0;
        }

        /* Loading View */
        .loading-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #1e293b; border-radius: 20px; border: 2px solid #334155;}
        .loading-box i { font-size: 4rem; color: #64748b; margin-bottom: 20px; }
        .loading-box p { font-size: 1.5rem; color: #94a3b8; font-weight: bold; text-transform: uppercase; }

        /* Animasi */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <div class="header-icon"><i class="fas fa-piggy-bank"></i></div>
            <div>
                <h1 id="mainTitle" class="header-title">TOP 10 PENABUNG</h1>
                <p id="subTitle" class="header-subtitle">Peringkat Individu Santri</p>
            </div>
        </div>
        <div class="header-right">
            <div id="clockDisplay" class="clock">00:00:00</div>
            <div id="dateDisplay" class="date">Memuat Tanggal...</div>
            <div id="syncStatus" class="sync-badge sync-ok">
                <i class="fas fa-sync-alt fa-spin"></i> Menyambungkan...
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-container">
        
        <!-- KOLOM KIRI (Top 3) -->
        <div class="col-left" id="topThreeContainer">
            <div class="loading-box">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Memuat Papan Skor...</p>
            </div>
        </div>

        <!-- KOLOM KANAN (Top 4-10) -->
        <div class="col-right" id="topOthersContainer">
            <!-- Isi List Kanan -->
        </div>

    </main>

    <script>
        // --- GANTI DENGAN URL APPS SCRIPT ANDA ---
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx0jQYSSfrN2dD8Wb4kaul0eItZ5tEG5jHO-6yN_UXnSHDxyif0adevn_fhudLBJmYB4w/exec';
        
        // Sensor Angka
        const formatNumber = (angka, isMasked) => {
            if (angka === 0 || !angka) return "0";
            const str = new Intl.NumberFormat('id-ID').format(angka);
            
            // Jika bukan mode siswa (berarti mode kelas), jangan sensor
            if (!isMasked) return str;
            
            // Sensor untuk mode individu siswa
            let masked = str.charAt(0);
            for (let i = 1; i < str.length; i++) {
                masked += (/[0-9]/.test(str[i])) ? 'X' : str[i];
            }
            return masked;
        };

        let currentView = 'siswa'; // 'siswa' atau 'kelas'
        let dataGlobal = [];

        function fetchLeaderboard() {
            const syncStatus = document.getElementById('syncStatus');
            syncStatus.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> Update...';
            syncStatus.style.color = '#fbbf24'; 
            syncStatus.style.backgroundColor = 'rgba(146, 64, 15, 0.5)';

            fetch(SCRIPT_URL + '?action=getDataSiswa')
                .then(res => res.json())
                .then(response => {
                    if (response.status === 'success') {
                        dataGlobal = response.data;
                        renderView(); // Render data
                        
                        const now = new Date();
                        const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(/\./g, ':');
                        syncStatus.innerHTML = `<i class="fas fa-check-circle"></i> Update: ${timeStr}`;
                        syncStatus.style.color = '#34d399';
                        syncStatus.style.backgroundColor = 'rgba(6, 78, 59, 0.5)';
                    }
                })
                .catch(error => {
                    syncStatus.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Offline';
                    syncStatus.style.color = '#f87171';
                    syncStatus.style.backgroundColor = 'rgba(127, 29, 29, 0.5)';
                });
        }

        // Tampilkan Tampilan Berdasarkan State currentView
        function renderView() {
            if(dataGlobal.length === 0) return;

            const mainTitle = document.getElementById('mainTitle');
            const subTitle = document.getElementById('subTitle');
            
            if (currentView === 'siswa') {
                mainTitle.textContent = "TOP 10 PENABUNG";
                subTitle.textContent = "Peringkat Individu Santri";
                const top10 = [...dataGlobal].sort((a, b) => b.tabungan - a.tabungan).slice(0, 10);
                drawCards(top10, 'siswa');
            } else {
                mainTitle.textContent = "PERINGKAT KELAS";
                subTitle.textContent = "Akumulasi Tabungan per Kelas";
                
                const kelasMap = {};
                dataGlobal.forEach(s => {
                    let k = s.kelas.trim().toUpperCase();
                    if(k) {
                        if(!kelasMap[k]) kelasMap[k] = 0;
                        kelasMap[k] += s.tabungan;
                    }
                });
                const arrayKelas = Object.keys(kelasMap).map(k => ({
                    nama: k.startsWith('KELAS') ? k : 'KELAS ' + k, 
                    kelas: 'TOTAL TABUNGAN KELAS',
                    tabungan: kelasMap[k]
                }));
                const top10Kelas = arrayKelas.sort((a, b) => b.tabungan - a.tabungan).slice(0, 10);
                drawCards(top10Kelas, 'kelas');
            }
        }

        function drawCards(top10, tipe) {
            const containerLeft = document.getElementById('topThreeContainer');
            const containerRight = document.getElementById('topOthersContainer');
            
            containerLeft.innerHTML = '';
            containerRight.innerHTML = '';

            top10.forEach((item, index) => {
                const rank = index + 1;
                let subIcon = tipe === 'siswa' ? 'fa-graduation-cap' : 'fa-users';
                let subtitleText = tipe === 'siswa' ? `KELAS ${item.kelas}` : `${item.kelas}`;
                let isMasked = (tipe === 'siswa');
                
                // --- RENDER TOP 3 (KIRI) ---
                if (rank <= 3) {
                    let bgClass = rank === 1 ? 'bg-gold' : (rank === 2 ? 'bg-silver' : 'bg-bronze');
                    let iconType = rank === 1 ? 'fa-trophy' : 'fa-medal';
                    let delay = index * 0.1; 

                    containerLeft.innerHTML += `
                        <div class="card-top ${bgClass} animate-in" style="animation-delay: ${delay}s">
                            <i class="fas ${iconType} watermark"></i>
                            <div class="top-rank">#${rank}</div>
                            <div class="top-details">
                                <div class="top-name" title="${item.nama}">${item.nama}</div>
                                <div class="top-class"><i class="fas ${subIcon}"></i> ${subtitleText}</div>
                                <div class="top-amount">Rp ${formatNumber(item.tabungan, isMasked)}</div>
                            </div>
                        </div>
                    `;
                } 
                // --- RENDER RANK 4 - 10 (KANAN) ---
                else {
                    let delay = (index - 3) * 0.1;
                    
                    containerRight.innerHTML += `
                        <div class="card-list animate-in" style="animation-delay: ${delay}s">
                            <div class="list-left">
                                <div class="list-rank">#${rank}</div>
                                <div class="list-details">
                                    <div class="list-name" title="${item.nama}">${item.nama}</div>
                                    <div class="list-class"><i class="fas ${subIcon}"></i> ${subtitleText}</div>
                                </div>
                            </div>
                            <div class="list-amount">Rp ${formatNumber(item.tabungan, isMasked)}</div>
                        </div>
                    `;
                }
            });
        }

        // --- SISTEM PERTUKARAN OTOMATIS LAYAR (30 Detik) ---
        setInterval(() => {
            currentView = currentView === 'siswa' ? 'kelas' : 'siswa';
            renderView(); // Tukar tampilan tanpa perlu fetch data ulang
        }, 30000); 

        // --- JAM DAN TANGGAL ---
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            document.getElementById('clockDisplay').innerText = timeStr.replace(/\./g, ':'); 
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('id-ID', options).toUpperCase();
        }

        // --- MULAI ---
        window.onload = () => {
            updateClock();
            setInterval(updateClock, 1000); // Update jam tiap detik
            
            fetchLeaderboard(); // Panggilan pertama
            setInterval(fetchLeaderboard, 60000); // Fetch data baru tiap 1 menit
        };
    </script>
</body>
</html>
