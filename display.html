<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Tabungan Santri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a; /* Fallback solid color */
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a 70%); 
            color: white;
            overflow: hidden; 
        }
        
        /* Animasi Masuk (Disederhanakan untuk TV lambat) */
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-list {
            animation: slideInRight 0.5s ease-out forwards;
            opacity: 0;
        }
        .animate-top3 {
            animation: scaleUp 0.5s ease-out forwards;
            opacity: 0;
        }

        /* Warna Top 3 (Aman untuk TV Lama) */
        .rank-1 { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .rank-2 { background: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 100%); }
        .rank-3 { background: linear-gradient(135deg, #fdba74 0%, #c2410c 100%); }
        
        /* Warna Rank 4-10 (Tanpa backdrop-blur yang bikin error) */
        .rank-other { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Watermark Piala */
        .watermark-icon {
            position: absolute;
            right: -5%;
            bottom: -15%;
            font-size: 16rem;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-6 box-border gap-6">

    <!-- HEADER (Solid Background instead of Blur) -->
    <header class="w-full flex justify-between items-center bg-slate-800 p-6 rounded-[2rem] border border-slate-700 shadow-xl shrink-0">
        <div class="flex items-center space-x-6">
            <div class="bg-gradient-to-br from-emerald-400 to-emerald-600 p-4 rounded-3xl flex items-center justify-center">
                <i class="fas fa-piggy-bank text-5xl text-white drop-shadow-md"></i>
            </div>
            <div>
                <h1 id="mainTitle" class="text-4xl lg:text-5xl font-black tracking-widest text-emerald-300 uppercase transition-opacity duration-500">TOP 10 PENABUNG</h1>
                <p id="subTitle" class="text-lg lg:text-xl text-slate-300 mt-1 font-semibold tracking-wider transition-opacity duration-500">Pondok Pesantren Sistem</p>
            </div>
        </div>
        <div class="text-right flex flex-col items-end">
            <div id="clockDisplay" class="text-5xl lg:text-6xl font-black font-mono tracking-widest text-white drop-shadow-md">00:00:00</div>
            <div id="dateDisplay" class="text-sm lg:text-base text-slate-300 mt-1 uppercase tracking-[0.1em] font-bold">Memuat Tanggal...</div>
            <div id="syncStatus" class="text-xs font-bold text-emerald-400 mt-2 bg-emerald-900/50 px-3 py-1 rounded-full border border-emerald-500/30">
                <i class="fas fa-sync-alt fa-spin mr-1.5"></i>Menyambungkan...
            </div>
        </div>
    </header>

    <!-- MAIN FLEXBOX (Mengganti CSS Grid dengan Flexbox yang lebih didukung TV lama) -->
    <main class="w-full flex-1 min-h-0 flex gap-6">
        
        <!-- KOLOM KIRI: Top 3 (Flex Column) -->
        <div class="w-1/2 flex flex-col gap-5" id="topThreeContainer">
            <div class="flex-1 flex flex-col items-center justify-center bg-slate-800 rounded-3xl border border-slate-700 w-full h-full">
                <i class="fas fa-spinner fa-spin text-6xl text-slate-500 mb-4"></i>
                <p class="text-slate-400 font-bold uppercase text-lg">Memuat Papan Skor...</p>
            </div>
        </div>

        <!-- KOLOM KANAN: Peringkat 4 - 10 (Flex Column) -->
        <div class="w-1/2 flex flex-col gap-3" id="topOthersContainer">
            <!-- Loading ditahan sementara -->
        </div>

    </main>

    <script>
        // --- GANTI DENGAN URL APPS SCRIPT ANDA ---
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx0jQYSSfrN2dD8Wb4kaul0eItZ5tEG5jHO-6yN_UXnSHDxyif0adevn_fhudLBJmYB4w/exec';
        
        const formatNumber = (angka, isMasked) => {
            if (angka === 0 || !angka) return "0";
            const str = new Intl.NumberFormat('id-ID').format(angka);
            if (!isMasked) return str;
            
            let masked = str.charAt(0);
            for (let i = 1; i < str.length; i++) {
                masked += (/[0-9]/.test(str[i])) ? 'X' : str[i];
            }
            return masked;
        };

        let currentView = 'siswa'; 
        let isFirstLoad = true;

        function fetchLeaderboard() {
            const syncStatus = document.getElementById('syncStatus');
            syncStatus.innerHTML = '<i class="fas fa-sync-alt fa-spin mr-1.5"></i>Update...';
            syncStatus.className = 'text-xs font-bold text-yellow-400 mt-2 bg-yellow-900/50 px-3 py-1 rounded-full border border-yellow-500/30';

            fetch(SCRIPT_URL + '?action=getDataSiswa')
                .then(res => res.json())
                .then(response => {
                    if (response.status === 'success') {
                        if (!isFirstLoad) {
                            currentView = currentView === 'siswa' ? 'kelas' : 'siswa';
                        }
                        isFirstLoad = false;
                        
                        renderView(response.data);
                        
                        const now = new Date();
                        const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(/\./g, ':');
                        syncStatus.innerHTML = `<i class="fas fa-check-circle mr-1.5"></i>Update: ${timeStr}`;
                        syncStatus.className = 'text-xs font-bold text-emerald-400 mt-2 bg-emerald-900/50 px-3 py-1 rounded-full border border-emerald-500/30';
                    }
                })
                .catch(error => {
                    syncStatus.innerHTML = '<i class="fas fa-exclamation-triangle mr-1.5"></i>Offline';
                    syncStatus.className = 'text-xs font-bold text-red-400 mt-2 bg-red-900/50 px-3 py-1 rounded-full border border-red-500/30';
                });
        }

        function renderView(dataSiswa) {
            const mainTitle = document.getElementById('mainTitle');
            const subTitle = document.getElementById('subTitle');
            
            mainTitle.style.opacity = '0';
            subTitle.style.opacity = '0';
            
            setTimeout(() => {
                if (currentView === 'siswa') {
                    mainTitle.textContent = "TOP 10 PENABUNG";
                    subTitle.textContent = "Peringkat Individu Santri";
                    const top10 = [...dataSiswa].sort((a, b) => b.tabungan - a.tabungan).slice(0, 10);
                    drawCards(top10, 'siswa');
                } else {
                    mainTitle.textContent = "PERINGKAT KELAS";
                    subTitle.textContent = "Akumulasi Tabungan Tertinggi per Kelas";
                    const kelasMap = {};
                    dataSiswa.forEach(s => {
                        let k = s.kelas.trim().toUpperCase();
                        if(k) {
                            if(!kelasMap[k]) kelasMap[k] = 0;
                            kelasMap[k] += s.tabungan;
                        }
                    });
                    const arrayKelas = Object.keys(kelasMap).map(k => ({
                        nama: k.startsWith('KELAS') ? k : 'KELAS ' + k, 
                        kelas: 'TOTAL TABUNGAN KELAS',
                        tabungan: kelasMap[k]
                    }));
                    const top10Kelas = arrayKelas.sort((a, b) => b.tabungan - a.tabungan).slice(0, 10);
                    drawCards(top10Kelas, 'kelas');
                }
                mainTitle.style.opacity = '1';
                subTitle.style.opacity = '1';
            }, 400); 
        }

        function drawCards(top10, tipe) {
            const containerLeft = document.getElementById('topThreeContainer');
            const containerRight = document.getElementById('topOthersContainer');
            
            containerLeft.innerHTML = '';
            containerRight.innerHTML = '';

            if (top10.length === 0) {
                containerLeft.innerHTML = `<div class="flex-1 flex items-center justify-center text-slate-400 text-3xl font-light w-full">Belum ada data</div>`;
                return;
            }

            top10.forEach((item, index) => {
                const rank = index + 1;
                let subIcon = tipe === 'siswa' ? 'fa-graduation-cap' : 'fa-users';
                let subtitleText = tipe === 'siswa' ? `KELAS ${item.kelas}` : `${item.kelas}`;
                
                // --- RENDER TOP 3 (KIRI - Flex-1 agar membagi rata) ---
                if (rank <= 3) {
                    let rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : 'rank-3');
                    let textColor = rank === 2 ? 'text-slate-800' : 'text-white';
                    let subTextColor = rank === 2 ? 'text-slate-700' : 'text-white/90';
                    let iconColor = rank === 1 ? 'text-yellow-100' : (rank === 2 ? 'text-slate-100' : 'text-orange-100');
                    let iconType = rank === 1 ? 'fa-trophy' : 'fa-medal';
                    let delay = index * 0.2; 

                    containerLeft.innerHTML += `
                        <div class="flex-1 w-full ${rankClass} rounded-2xl p-6 flex flex-row items-center animate-top3 relative overflow-hidden shadow-lg" style="animation-delay: ${delay}s">
                            <!-- Watermark -->
                            <i class="fas ${iconType} watermark-icon ${iconColor}"></i>
                            
                            <!-- Nomor Rank -->
                            <div class="text-6xl font-black italic drop-shadow-md w-24 shrink-0 flex items-center justify-center ${textColor}">
                                #${rank}
                            </div>
                            
                            <!-- Detail Nama & Uang (Tumpuk Bawah) -->
                            <div class="flex-1 min-w-0 flex flex-col justify-center pl-6 border-l-2 border-white/20 z-10">
                                <h2 class="text-3xl lg:text-4xl font-black uppercase truncate drop-shadow-sm ${textColor}" title="${item.nama}">
                                    ${item.nama}
                                </h2>
                                <div class="text-sm lg:text-base font-bold mt-1 flex items-center ${subTextColor} tracking-widest uppercase mb-1">
                                    <i class="fas ${subIcon} mr-2 opacity-75"></i> ${subtitleText}
                                </div>
                                <div class="text-4xl lg:text-5xl font-black tracking-tighter drop-shadow-md ${textColor}">
                                    Rp ${formatNumber(item.tabungan, tipe === 'siswa')}
                                </div>
                            </div>
                        </div>
                    `;
                } 
                // --- RENDER RANK 4 - 10 (KANAN - Flex-1) ---
                else {
                    let delay = (index - 3) * 0.1;
                    
                    containerRight.innerHTML += `
                        <div class="flex-1 w-full rank-other rounded-xl px-5 py-3 flex flex-row items-center justify-between animate-list" style="animation-delay: ${delay}s">
                            <!-- Rank & Nama -->
                            <div class="flex items-center flex-1 min-w-0">
                                <div class="text-2xl font-black text-slate-500 w-12 shrink-0 italic">#${rank}</div>
                                <div class="flex-1 min-w-0 flex flex-col justify-center pl-3 border-l border-white/10">
                                    <h3 class="text-xl font-bold text-white uppercase tracking-wide truncate" title="${item.nama}">
                                        ${item.nama}
                                    </h3>
                                    <p class="text-xs text-slate-400 font-semibold uppercase tracking-widest"><i class="fas ${subIcon} mr-1.5 opacity-75"></i>${subtitleText}</p>
                                </div>
                            </div>
                            
                            <!-- Kotak Uang -->
                            <div class="shrink-0 text-xl font-black text-emerald-400 tracking-wider bg-slate-900/50 px-4 py-2 rounded-lg border border-emerald-500/20 shadow-inner ml-3">
                                Rp ${formatNumber(item.tabungan, tipe === 'siswa')}
                            </div>
                        </div>
                    `;
                }
            });
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            document.getElementById('clockDisplay').innerText = timeStr.replace(/\./g, ':'); 
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('id-ID', options).toUpperCase();
        }

        window.onload = () => {
            updateClock();
            setInterval(updateClock, 1000);
            fetchLeaderboard();
            setInterval(fetchLeaderboard, 30000); 
        };
    </script>
</body>
</html>
