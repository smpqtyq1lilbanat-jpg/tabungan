<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Tabungan Santri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a 70%); 
            color: white;
            overflow: hidden; /* Mencegah scrollbar di TV */
        }
        
        /* Animasi Masuk */
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-list {
            animation: slideInRight 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }
        .animate-top3 {
            animation: scaleUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        /* Warna Top 3 */
        .rank-1 { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); box-shadow: 0 15px 35px -5px rgba(217, 119, 6, 0.6); }
        .rank-2 { background: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 100%); box-shadow: 0 15px 35px -5px rgba(156, 163, 175, 0.5); }
        .rank-3 { background: linear-gradient(135deg, #fdba74 0%, #c2410c 100%); box-shadow: 0 15px 35px -5px rgba(194, 65, 12, 0.5); }
        
        /* Warna Rank 4-10 */
        .rank-other { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); }
        
        /* Watermark Piala */
        .watermark-icon {
            position: absolute;
            right: -5%;
            bottom: -15%;
            font-size: 15rem;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-6 xl:p-8 box-border gap-6">

    <header class="w-full flex justify-between items-center bg-white/5 backdrop-blur-xl p-6 rounded-3xl border border-white/10 shadow-2xl shrink-0">
        <div class="flex items-center space-x-6">
            <div class="bg-gradient-to-br from-green-400 to-emerald-600 p-5 rounded-2xl shadow-lg flex items-center justify-center">
                <i class="fas fa-piggy-bank text-5xl text-white"></i>
            </div>
            <div>
                <h1 class="text-4xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-cyan-300 uppercase">Top 10 Penabung</h1>
                <p class="text-xl text-slate-300 mt-1 font-semibold tracking-wider">Pondok Pesantren Sistem</p>
            </div>
        </div>
        <div class="text-right flex flex-col items-end">
            <div id="clockDisplay" class="text-6xl font-black font-mono tracking-widest drop-shadow-lg text-white">00:00:00</div>
            <div id="dateDisplay" class="text-lg text-slate-300 mt-2 uppercase tracking-[0.2em] font-bold">Memuat Tanggal...</div>
            <div id="syncStatus" class="text-sm font-medium text-emerald-400 mt-2 bg-emerald-900/40 px-3 py-1 rounded-full border border-emerald-500/30">
                <i class="fas fa-sync-alt fa-spin mr-2"></i>Menyambungkan...
            </div>
        </div>
    </header>

    <main class="w-full flex-1 min-h-0 grid grid-cols-2 gap-8">
        
        <!-- KOLOM KIRI: Top 3 -->
        <div class="grid grid-rows-3 gap-6" id="topThreeContainer">
            <div class="h-full flex flex-col items-center justify-center bg-white/5 rounded-3xl animate-pulse border border-white/5 row-span-3">
                <i class="fas fa-spinner fa-spin text-7xl text-slate-500 mb-4"></i>
                <p class="text-slate-400 font-medium tracking-widest uppercase">Memuat Juara...</p>
            </div>
        </div>

        <!-- KOLOM KANAN: Peringkat 4 - 10 -->
        <div class="grid grid-rows-7 gap-4" id="topOthersContainer">
            <div class="h-full flex items-center justify-center bg-white/5 rounded-3xl animate-pulse border border-white/5 row-span-7">
                <p class="text-slate-400 font-medium tracking-widest uppercase">Memuat Daftar...</p>
            </div>
        </div>

    </main>

    <script>
        // --- GANTI DENGAN URL APPS SCRIPT ANDA ---
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx0jQYSSfrN2dD8Wb4kaul0eItZ5tEG5jHO-6yN_UXnSHDxyif0adevn_fhudLBJmYB4w/exec';
        
        const formatNumber = (angka) => {
            return new Intl.NumberFormat('id-ID').format(angka);
        };

        function fetchLeaderboard() {
            const syncStatus = document.getElementById('syncStatus');
            syncStatus.innerHTML = '<i class="fas fa-sync-alt fa-spin mr-2"></i>Memperbarui data...';
            syncStatus.className = 'text-sm font-medium text-yellow-400 mt-2 bg-yellow-900/40 px-3 py-1 rounded-full border border-yellow-500/30 transition-colors';

            fetch(SCRIPT_URL + '?action=getDataSiswa')
                .then(res => res.json())
                .then(response => {
                    if (response.status === 'success') {
                        renderLeaderboard(response.data);
                        
                        const now = new Date();
                        const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(/\./g, ':');
                        syncStatus.innerHTML = `<i class="fas fa-check-circle mr-2"></i>Update: ${timeStr}`;
                        syncStatus.className = 'text-sm font-medium text-emerald-400 mt-2 bg-emerald-900/40 px-3 py-1 rounded-full border border-emerald-500/30 transition-colors';
                    } else {
                        throw new Error(response.message);
                    }
                })
                .catch(error => {
                    console.error("Gagal mengambil data:", error);
                    syncStatus.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i>Koneksi Terputus';
                    syncStatus.className = 'text-sm font-medium text-red-400 mt-2 bg-red-900/40 px-3 py-1 rounded-full border border-red-500/30 transition-colors';
                });
        }

        function renderLeaderboard(dataSiswa) {
            // Sort data descending by tabungan
            const sortedData = dataSiswa.sort((a, b) => b.tabungan - a.tabungan);
            const top10 = sortedData.slice(0, 10);
            
            const containerLeft = document.getElementById('topThreeContainer');
            const containerRight = document.getElementById('topOthersContainer');
            
            containerLeft.innerHTML = '';
            containerRight.innerHTML = '';

            if (top10.length === 0) {
                containerLeft.innerHTML = `<div class="h-full flex items-center justify-center text-slate-400 text-3xl font-light row-span-3">Belum ada data tabungan</div>`;
                return;
            }

            top10.forEach((siswa, index) => {
                const rank = index + 1;
                
                // --- RENDER TOP 3 (KOLOM KIRI) ---
                if (rank <= 3) {
                    let rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : 'rank-3');
                    let textColor = rank === 2 ? 'text-slate-800' : 'text-white';
                    let subTextColor = rank === 2 ? 'text-slate-700' : 'text-white/90';
                    let iconColor = rank === 1 ? 'text-yellow-100' : (rank === 2 ? 'text-slate-100' : 'text-orange-100');
                    let iconType = rank === 1 ? 'fa-trophy' : 'fa-medal';
                    let delay = index * 0.2; 

                    containerLeft.innerHTML += `
                        <div class="w-full h-full ${rankClass} rounded-3xl p-6 flex flex-row items-center animate-top3 relative overflow-hidden shadow-2xl" style="animation-delay: ${delay}s">
                            <!-- Watermark -->
                            <i class="fas ${iconType} watermark-icon ${iconColor}"></i>
                            
                            <!-- Nomor Rank -->
                            <div class="text-5xl font-black italic drop-shadow-xl w-20 shrink-0 text-center flex items-center justify-center ${textColor}">
                                #${rank}
                            </div>
                            
                            <!-- Detail Nama & Uang -->
                            <div class="flex-1 min-w-0 flex flex-col justify-center pl-5 border-l-2 border-white/10 z-10">
                                <h2 class="text-2xl 2xl:text-3xl font-black uppercase truncate drop-shadow-md ${textColor}" title="${siswa.nama}">
                                    ${siswa.nama}
                               </h2>
                                <div class="text-lg font-bold mt-1 mb-3 flex items-center ${subTextColor} tracking-widest uppercase">
                                    <i class="fas fa-graduation-cap mr-2 opacity-75"></i> Kelas ${siswa.kelas}
                                </div>
                                <div class="text-5xl font-black tracking-tighter drop-shadow-xl ${textColor}">
                                    Rp ${formatNumber(siswa.tabungan)}
                                </div>
                            </div>
                        </div>
                    `;
                } 
                // --- RENDER RANK 4 - 10 (KOLOM KANAN) ---
                else {
                    let delay = (index - 3) * 0.15;
                    
                    containerRight.innerHTML += `
                        <div class="w-full h-full rank-other rounded-2xl px-6 py-0 flex flex-row items-center justify-between animate-list shadow-sm" style="animation-delay: ${delay}s">
                            
                            <!-- Rank & Nama -->
                            <div class="flex items-center flex-1 min-w-0">
                                <div class="text-3xl font-black text-slate-500 w-16 shrink-0 italic">#${rank}</div>
                                <div class="flex-1 min-w-0 flex flex-col justify-center pl-4">
                                    <h3 class="text-xl font-bold text-white uppercase tracking-wider truncate drop-shadow-sm" title="${siswa.nama}">
                                        ${siswa.nama}
                                    </h3>
                                    <p class="text-sm text-slate-400 font-semibold mt-0.5 tracking-widest uppercase">Kelas ${siswa.kelas}</p>
                                </div>
                            </div>
                            
                            <!-- Kotak Uang -->
                            <div class="shrink-0 text-2xl font-black text-emerald-400 tracking-wider bg-emerald-900/30 px-5 py-2 rounded-xl border border-emerald-500/20 shadow-inner ml-4">
                                Rp ${formatNumber(siswa.tabungan)}
                            </div>
                        </div>
                    `;
                }
            });
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            document.getElementById('clockDisplay').innerText = timeStr.replace(/\./g, ':'); 
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('id-ID', options);
        }

        window.onload = () => {
            updateClock();
            setInterval(updateClock, 1000);
            fetchLeaderboard();
            setInterval(fetchLeaderboard, 60000); // Auto update tiap 1 menit
        };
    </script>
</body>
</html>
